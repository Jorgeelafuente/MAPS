<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Mapa Recogidas</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<header>

    <h1>Control de Recogidas</h1>

    <div class="upload-box">
        <input type="file" id="fileInput" accept=".xlsx">
    </div>

</header>

<div class="main-container">

    <div class="sidebar">

        <h2>Resumen Diario</h2>

        <div class="info-card">
            <h3>Clientes cargados</h3>
            <p id="totalClientes">0 clientes</p>
        </div>

        <div class="info-card">
            <h3>Congelado</h3>
            <p id="totalCongelado">0 pallets</p>
        </div>

        <div class="info-card">
            <h3>Refrigerado</h3>
            <p id="totalRefrigerado">0 pallets</p>
        </div>

    </div>

    <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<script src="app.js"></script>

</body>
</html>
