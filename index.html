<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Control de Recogidas</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<header>

    <h1>Control de Recogidas</h1>

    <div class="top-buttons">

        <!-- BOTÓN CONDUCTORES -->

        <button id="driversBtn">
            Conductores
        </button>

        <!-- SUBIR CLIENTES -->

        <div class="upload-wrapper">

            <label
                for="fileInput"
                class="upload-btn"
            >
                Subir Clientes
            </label>

            <input type="file"
                   id="fileInput"
                   accept=".xlsx">

            <span id="clientsFileName"></span>

        </div>

    </div>

</header>

<div class="main-container">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>Resumen Diario</h2>

        <div class="info-card">
            <h3>Clientes cargados</h3>
            <p id="totalClientes">0 clientes</p>
        </div>

        <div class="info-card">
            <h3>Congelado</h3>
            <p id="totalCongelado">0 pallets</p>
        </div>

        <div class="info-card">
            <h3>Refrigerado</h3>
            <p id="totalRefrigerado">0 pallets</p>
        </div>

    </div>

    <!-- MAPA -->

    <div id="map"></div>

</div>

<!-- MODAL CONDUCTORES -->

<div id="driversModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Conductores</h2>

            <button id="closeModal">
                ✖
            </button>

        </div>

        <!-- SUBIR EXCEL -->

        <div class="drivers-upload">

            <div class="upload-wrapper">

                <label
                    for="driversFile"
                    class="upload-btn"
                >
                    Subir Conductores
                </label>

                <input type="file"
                       id="driversFile"
                       accept=".xlsx">

                <span id="driversFileName"></span>

            </div>

        </div>

        <!-- AÑADIR -->

        <div class="add-driver">

            <input type="text"
                   id="driverName"
                   placeholder="Nombre conductor">

            <button id="addDriverBtn">
                Añadir
            </button>

        </div>

        <!-- LISTA -->

        <div id="driversList">

        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<script src="app.js"></script>

</body>
</html>
